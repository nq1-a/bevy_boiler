[package]
name = "bevy_boiler"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["dynamic_linking"] }
bevy_rapier3d = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
